apiVersion: apps/v1
kind: Deployment
metadata:
  name: apigateway
  labels:
    app: apigateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apigateway
  template:
    metadata:
      labels:
        app: apigateway
    spec:
      containers:
        - name: apigateway
          image: library-management-system-microservice-eventsourcing-apigateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080





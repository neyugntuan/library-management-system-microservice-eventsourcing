apiVersion: v1
kind: Service
metadata:
  name: axonserver
spec:
  type: NodePort
  selector:
    app: axonserver
  ports:
    - name: dashboard
      port: 8024
      targetPort: 8024
      nodePort: 30024
      protocol: TCP
    - name: grpc
      port: 8124
      targetPort: 8124
      protocol: TCP
    - name: admin
      port: 8224
      targetPort: 8224
      protocol: TCP
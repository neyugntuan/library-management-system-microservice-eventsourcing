apiVersion: v1
kind: Service
metadata:
  name: axonserver-headless
  labels:
    app: axonserver
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: axonserver
  ports:
    - name: dashboard
      port: 8024
      targetPort: dashboard
    - name: grpc
      port: 8124
      targetPort: grpc
    - name: admin
      port: 8224
      targetPort: admin

server:
  port: 8080

spring:
  application:
    name: gateway-service
  data:
    redis:
      port: 6379
      host: redis
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: employeeservice
          uri: lb://employeeservice
          predicates:
            - Path=/api/v1/employees/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10 #trong 1s nap lai x token
                redis-rate-limiter.burstCapacity: 20 #toi da trong bucket co x token
                redis-rate-limiter.requestedTokens: 1 #1 request = 1 token
            - KeyAuthFilter
        - id: bookservice
          uri: lb://bookservice
          predicates:
            - Path=/api/v1/books/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10 #trong 1s nap lai x token
                redis-rate-limiter.burstCapacity: 20 #toi da trong bucket co x token
                redis-rate-limiter.requestedTokens: 1 #1 request = 1 token
            - KeyAuthFilter
        - id: userservice
          uri: http://localhost:9005
          predicates:
            - Path=/api/v1/users/**
          filters:
            - name: JwtHeaderFilter
        - id: userservice-public
          uri: http://localhost:9005
          predicates:
            - Path=/api/v1/public/**


  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/neyugntuan
eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
      register-with-eureka: true
      fetch-registry: true

